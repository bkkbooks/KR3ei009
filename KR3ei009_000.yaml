body:
  text: 前序余聞軒岐事業遐哉邈矣其言説流布至今未盡泯也然傳者或效或否豈其書不可盡信耶是信乎人焉耳語曰醫不通儒不可以言醫其以是歟太醫院使薛君立齋雅近於儒其以醫名世也固宜君嘗以日所施活者述其病原詳其脈候著其方驗有所得輒録之積匯成帙標曰家居醫録他日呈於大司馬中丞約菴翁翁覽而善之授余以鋟諸梓且命申其説余曰嘻是仁者之心哉或曰何謂也夫醫術也而心術觀焉世之醫者得一方輒以自祕取一效即以自多人病在身而渠病在心且弗之藥是尚可以言醫薛君以名醫致身不自祕而以示人將欲致人人於名醫中丞翁撫綏畿輔振衰剔弊既登斯民仁壽之域復布其醫書欲壽斯民於無窮茲非仁者之事哉是宜梓之以訓於世觀者毋徒執其方而求得其心焉則是録也其可傳矣嘉靖戊申春正月吉劍江存所範慶書
