body:
  text: 卷上經候不調經曰飲食入胃遊溢精氣上輸於脾脾氣散精上歸於肺通調水道下輸膀胱水經四布五經並行故心脾平和則經候如常苟或七情內傷六淫外侵飲食失節起居失宜脾胃虛損則月經不調矣若先期而至者有因脾經血燥有因脾經鬱滯有因肝經怒火有因血分有熱有因勞役火動其過期而至者有因脾經血虛有因肝經血少有因氣虛血弱主治之法脾經血燥者加味逍遙散脾經鬱滯者歸脾湯肝經怒火者加味小柴胡湯血分有熱者加味四物湯勞役火動者補中益氣湯脾經血虛者人參養榮湯肝經血少者六味地黃丸氣虛血弱者八珍湯蓋血生於脾土故云脾統血凡血病當用苦甘之劑以助其陽氣而生陰血俱屬不足大凡肝脾血燥四物為主肝脾血弱補中益氣為主肝脾鬱結歸脾湯為主肝經怒火加味逍遙為主治驗肝經怒火風熱等症附一婦人內熱作渴飲食少思腹內近左初如雞卵漸大四寸許經水三月一至肢體消瘦齒頰似瘡脈洪數而虛左關尤甚此肝脾鬱結之症外貼阿魏膏午前用補中益氣湯午後以加味歸脾湯兩月許肝火少退脾土少健仍與前湯送六味地黃丸午後又用逍遙散送歸脾丸又月餘日用蘆薈丸二服空心以逍遙散下日晡以歸脾湯下喜其謹疾調理年餘而愈一婦人腹內一塊不時上攻或痛作聲吞酸痞悶月經不調小便不利二年餘矣面色青黃相兼余作肝脾氣滯以六君子加芎歸柴胡炒連木香吳茱各少許二劑卻與歸脾湯下蘆薈丸三月餘肝脾和而諸症退又與調中益氣加茯苓丹皮中氣健而經自調一婦人發熱口乾月經不調兩腿無力服祛風滲濕之劑腿痛體倦二膝浮腫經事不通余作肝脾腎三經血虛火燥症名鶴膝風用六味八味二丸兼服兩月形體漸健飲食漸進膝腫漸消不半載而痊前症若脾腎虛寒腿足軟痛或足膝枯細用八味丸若飲食過多腿足或臀內酸脹或浮腫作痛用補中益氣加茯苓半夏主之一婦人性沉靜勤於女工善怒小腹內結一塊或作痛或痞悶月經不調恪服伐肝之劑內熱寒熱胸膈不利飲食不甘形體日瘦牙齦蝕爛此脾土不能生肺金肺金不能生腎水腎水不能生肝木當滋化源用補中益氣六味地黃至仲春而愈松江太守何恭人性善怒腹聚一塊年餘形體骨立倏熱往來齶蝕透腮或泥春旺木剋土仍行伐肝時季冬肝脈洪數按之弦緊餘脈微弱余曰洪數弦緊肝經真氣虛而邪氣實也自保不及何能剋土況面色青中隱白乃腎水不足肝木虧損肺金剋制惟慮至春木不能發生耳勉用壯脾胃滋腎水之劑肝脈悉退後大怒耳內出血肝脈仍大按之如無煩躁作渴此無根之火以前藥加肉桂二劑肝脈仍斂熱渴頓退復因大怒以致飲食不進果卒於季冬辛巳日此木衰弱而金刑剋信夫一婦人經候過期發熱倦怠或用四物黃連之類反兩月一度且少而成塊又用峻藥通之兩目如帛所蔽余曰脾為諸陰之首目為血脈之宗此脾傷五臟皆為失所不能歸於目矣遂用補中益氣濟生歸脾二湯專主脾胃年餘尋愈一婦人兩眉稜痛後及太陽面青喜怒余作膽經風熱用選奇湯合逍遙散加山梔天麻黃耆半夏黃芩而愈此症失治多致傷目或兩耳出膿則危矣一婦人耳鳴內熱經行不調肢體倦怠飲食無味余以為肝脾虛熱用四君加柴胡山梔丹皮甘草而愈一婦人素勤苦冬初患咳嗽發熱久而吐血盜汗經水兩三月一至遍身作痛或用化痰降火口噤筋攣謂余曰何也余曰此血虛而藥益損耳遂用加減八味丸及補中益氣加麥門五味山藥治之年餘而痊一婦人耳內或耳後項側作痛寒熱口苦月經不調余以為肝火氣滯而血凝用小柴胡加山梔川芎丹皮治之諸症悉退一婦人年四十素性急先因飲食難化月經不調服理氣化痰藥反肚腹膨脹大便泄瀉又加烏藥蓬朮肚腹腫脹小便不利加豬苓澤瀉痰喘氣急手足厥冷頭面肢體腫脹指按成窟脈沉細右寸為甚余曰此脾肺之氣虛寒不能通調水道下輸膀胱滲泄之令不行生化之氣不運即東垣所云水飲留積若土之在雨中則為泥矣得和風暖日水濕去而陽化自然萬物生長喜其脈相應遂與金匱加減腎氣丸料服之小便即通數劑腫脹消半四肢漸溫自能轉側又與六君加木香肉桂炮姜治之痊愈後不戒七情飲食即為泄瀉仍用前藥加附子五分而安一婦人飲食每用碗許稍加非大便不實必吞酸噯腐或以為胃火用二陳黃連枳實加內熱作嘔余曰此未傳寒中故噯氣吞酸脹滿痞悶不信仍作火治虛症並至月經不止始信余以六君加炮薑木香數劑元氣漸復飲食漸進又以補中益氣加炮薑木香茯苓半夏數劑痊愈後因飲食勞倦兼之怒氣飲食頓少元氣頓怯用前藥更加發熱誠似實火脈洪大按之而虛兩尺如無此命門火衰用補中益氣加薑桂及八味丸兼服兩月餘諸症悉愈此症若因中氣虛弱者用人參理中湯或六君子加木香炮姜不應用左金丸或越鞠丸虛寒者加附子或附子理中湯無有不愈一婦人素有頭暈不時而作月經遲而少余以為中氣虛不能上升而頭暈不能下化而經少用補中益氣湯而愈後因勞而僕月經如湧此勞傷火動用前湯加五味子一劑服之即愈前症雖云亡血過多氣無所附實因脾氣虧損耳一婦人年四十勞則足跟熱痛余以為陰血虛極急用聖愈湯而痊後遍身搔癢誤服風藥發熱抽搐肝脈洪數此乃肝家血虛火盛而生風以天竺膽星為丸用四物麥門五味芩連炙草山梔柴胡煎送而愈一婦人兩足發熱日晡益甚小便自遺或時不利余以為肝熱陰挺不能約制午前用白朮茯苓丹皮澤瀉各五分乾山藥山茱麥門各一錢熟地四錢酒炒黑黃柏七分知母五分不數劑而諸症悉愈若用分利之劑愈損真陰必致不起一婦人月事未期而至發熱自汗服清熱止汗之劑反作渴頭痛手掉身麻此因肝經風熱用柴胡炒芩連炒山梔歸芍生地丹皮各一錢參耆苓術各一錢五分川芎七分甘草五分二劑其汗全止更以補中益氣而愈凡發熱久者陽氣亦自病須調補之一婦人經行後勞役失調忽然昏憒面赤吐痰此元氣虛火妄動急飲童便神思漸爽更用參耆各五錢芎歸各三錢玄參柴胡山梔炙草各一錢一劑又用逍遙散加五味麥門稍定但體倦面黃此脾土真虛之色也又以十全大補加五味麥門治之而愈若投以發散之劑禍在反掌慎之西賓錢思習子室年三十尚無嗣月經淋瀝無期夫婦異處者幾年矣思習欲為娶妾以謀諸餘余曰此鬱怒傷肝脾虛火動而血不歸經乃肝不能藏脾不能攝也當清肝火補脾氣遂與加味歸脾逍遙二藥四劑送至其家仍告其姑曰服此病自愈而當受胎妾可無娶也果病愈次年生子一婦人多怒經行或數日或半月即止三年後淋瀝無期肌體倦瘦口乾內熱盜汗如洗日晡熱甚余用參耆歸朮茯神遠志棗仁麥門五味丹皮龍眼肉炙草柴胡升麻治之獲痊此症先因怒動肝火血熱妄行後乃脾氣下陷不能攝血歸源故用前藥若胃熱亡津液而經不行宜清胃若心火亢甚者宜清心若服燥藥過多者宜養血若病久氣血衰宜健脾胃一婦人年五十內熱晡熱經水兩三月一來此血虛而有熱用逍遙散加山茱治之而愈若兼有痰作渴或小便不調或頭暈白帶宜用腎氣丸一婦人氣血素虛經行不調飲食少思日晡熱甚用十全大補加山茱山藥丹皮麥門五味而愈次年秋患寒熱或用清脾飲而元氣愈弱余仍以前藥而愈一婦人生七胎矣月經不調兩足發熱年餘而身亦熱勞則足痠痛又年許唇腫裂痛又半年唇裂見血形體瘦倦飲食無味月水不通唇下腫如黑棗或用通經丸等藥而死一婦人善怒經不調唇腫裂服消毒藥唇脹出血年餘矣余曰當培養脾胃以滋化源不信仍服前藥及追蝕狀如翻花瘤而死一膏粱之婦產後月經不調唇裂內熱每焮作服寒涼之劑後不時出水余用加味清胃散而愈後值春令兼怒唇口腫脹寒熱作嘔痰甚少食用小柴胡加山梔茯苓桔梗諸症頓愈但內熱仍作乃以加味逍遙散調理而安一婦人性善怒產後唇腫內熱用清熱敗毒唇口腫脹日晡熱甚月水不調用降火化痰食少作嘔大便不實唇出血水用理氣消導胸膈痞滿頭目不清唇腫經閉用清胃行血肢體倦怠發熱煩躁涎水湧出欲用通經之劑余曰病本七情肝脾虧損數行攻伐元氣益虛故耳法當補陰益陽遂以加味歸脾湯加味逍遙散補中益氣湯如法調治元氣漸復唇瘡亦愈後因怒寒熱耳痛胸膈脹悶唇焮腫甚此是怒動肝火而血傷遂用四物合小柴胡加山梔頓愈後又怒脅乳作脹肚腹作痛嘔吐酸涎飲食不入小水不利此是怒動肝木克脾土乃用補脾氣養脾血而愈又因勞役怒氣飲食失時發熱喘渴體倦不食去血如崩唇腫熾甚此是肝經有火脾經氣虛遂用補中益氣加炒黑山梔芍藥丹皮而愈此症每見但治其瘡不固其本而死者多矣經漏不止經云陰虛陽搏謂之崩又云陽絡傷血外溢陰絡傷血內溢又云脾統血肝藏血其為患因脾胃虛損不能攝血歸源或因肝經有火血得熱而下行或因肝經有風血得風而妄行或因怒動肝火血熱而沸騰或因脾經鬱結血傷而不歸經或因悲哀太過胞絡傷而下崩治療之法脾胃虛弱者六君子湯加當歸川芎柴胡脾胃虛陷者補中益氣湯加酒炒芍藥山梔肝經血熱者四物湯加柴胡山梔苓術肝經怒火者小柴胡湯加山梔芍藥丹皮脾經鬱火者歸脾湯加山梔柴胡丹皮哀傷胞絡者四君子湯加柴胡升麻山梔故東垣丹溪諸先生云凡下血症須用四君子以收功斯言厥有旨哉若大吐血後毋以脈診當急用獨參湯救之其發熱潮熱咳嗽脈數乃是元氣虛弱假熱之脈也尤當用人參之類此等症候無不由脾胃先損而患故脈洪大察其中有胃氣受補可救設用寒涼之藥復傷脾胃生氣使血反不歸源也治驗吐血等症附一婦人年將七十素有肝脾之症每作則飲食不進或胸膈不利或中脘作痛或大便作瀉或小便不利余用逍遙散加山梔茯神遠志木香而愈後憂女孀居不時吐紫血每作先倦怠煩熱以前藥加炒黑黃連三分吳茱二分頓愈後因怒吐赤血甚多躁渴垂死此血脫也法當補氣乃用人參一兩苓朮當歸各三錢陳皮炮黑乾薑各二錢炙草木香各一錢一劑頓止信藥有回生之功不可委於天命也一婦人年六十有四久鬱怒頭痛寒熱春間乳內時痛服流氣飲之類益甚不時有血如經行又大驚恐飲食不進夜寐不寧乳腫及兩脅焮痛如炙午後色赤余以為肝脾鬱火血燥先以逍遙散加酒炒黑龍膽一錢山梔一錢五分二劑腫痛頓退又二劑而全消再用歸脾加炒梔貝母諸症悉愈一婦人久患血崩肢體消瘦飲食到口但聞腥臊口出津液強食少許腹中作脹此血枯之症肺肝脾胃虧損之患用八珍湯烏賊魚骨圓兼服兩月而經行百餘劑而康寧如舊矣一婦人性急躁瘰癧後吐血發熱兩脅脹痛日晡為甚余以為怒氣傷肝氣血俱虛遂朝用逍遙散倍加炒黑山梔黃柏貝母桔梗麥門五味夕以歸脾湯送地黃丸諸症並愈一婦人素勤苦因喪子飲食少思忽吐血甚多而自止此後每勞則吐數口瘵症已具形體甚倦午前以補中益氣午後以歸脾湯送地黃丸而愈一女子素鬱結胸滿食少吐血面赤用地黃丸及歸脾加山梔貝母芍藥而愈一婦人面黃或赤時覺腰間或臍下作痛四肢困倦煩熱不安其經若行先發寒熱兩肋如束其血如崩此脾胃虧損元氣下陷與相火濕熱所致用補中益氣加防風芍藥炒黑黃柏間以歸脾湯調補化源血自歸經矣一婦人因怒崩血久不已面青黃而或赤此肝木製脾土而血虛也用小柴胡合四物以清肝火生肝血又用歸脾補中二湯以益脾氣生肝血而瘥此症若因肝經有風熱而血不寧者用防風一味為丸以兼症之藥煎送或肝經火動而血不寧者用條芩炒為丸以兼症之藥煎送無有不效一婦人性急每怒非太陽耳項喉齒胸乳作痛則胸滿吞酸吐瀉少食經行不止此皆肝火之症肝自病則外症見土受克則內症作若自病見用四物加白朮茯苓柴胡炒梔炒龍膽若內症作用四君加柴胡芍藥神麯吳茱炒過黃連諸症漸愈惟月經不止是血分有熱脾氣尚虛以逍遙散倍用白朮茯苓陳皮又以補中益氣加酒炒芍藥兼服而調乾內錢氏年五十歲辛丑患崩諸藥罔效壬寅八月身熱肢痛頭暈涕出吐痰少食眾作火治轉熾絕粒數日淹淹伏枕僅存呼吸兄方浙歸診之謂脾胃虛寒用八味丸料一劑使急煎服然胃虛久始下咽翌早遂索粥數匙再劑食倍熱減痛止兼服八味丸良愈癸卯秋因勞役憂怒甲辰春夏崩復作六月二十日胸飽發熱脊痛腰不可轉神氣怫鬱或作內傷或作中暑崩水沸騰兼以便血煩渴引飲粒米不進至七月十三日晝夜暈憒時作時止計無所出仍屈兄診之脈洪無倫按之微弱此無根之火內真寒而外假熱也以十全大補加附子一劑暈止食粥三四匙崩血漸減日服八味丸始得痊愈乾山妻兩構危疾命懸須臾荷兄遠救誠解倒懸之急處方神良知無出此野人懷恩姑俟後日玉環之報云爾嘉靖甲辰季秋表弟方乾頓首拜書大化內患月事不期崩血昏憒發熱不寐或謂血熱妄行投以寒劑益甚或謂胎成受傷投以止血亦不效乃敬延先生診之曰此脾氣虛弱無以統攝故耳法當補脾而血自止矣用補中益氣加炮姜不數劑而驗惟終夜少睡驚悸另服八物湯更不效叩諸先生曰雜矣乃與歸脾湯加炮姜以補心脾遂如初謹敘其梗概以附醫案俾後之患者得有所取法云嘉靖甲辰孟冬晚生歸大化頓首拜書經閉不行夫經水陰血也屬衝任二脈主上為乳汁下為月水其為患有因脾虛而不能生血者有因脾郁傷而血耗損者有因胃火而血消爍者有因脾胃損而血少者有因勞傷心而血少者有因怒傷肝而血少者有因腎水不能生肝而血少者有因肺氣虛不能行血而閉者治療之法若脾虛而不行者調而補之脾鬱而不行者解而補之胃火而不行者清而補之脾胃損而不行者調而補之勞傷心血而不行者靜而補之怒傷肝而不行者和而補之肺氣虛而不行者補脾胃腎虛而不行者補脾肺經云損其肺者益其氣損其心者調其榮衛損其脾者調其飲食適其寒溫損其肝者緩其中損其腎者益其精審而治之庶無誤矣治驗一婦人停食飽悶發熱或用人參養胃湯益甚再用木香檳榔丸泄瀉吐痰腹中成塊飲食少思又用二陳黃連厚朴之類前症益甚腹脹不食月經不至余以為中氣虧損用補中益氣加茯苓半夏三十餘劑脾胃健而諸症愈又二十餘劑而經自行前症若脾虛不能消化飲食者宜用六君子湯補而消之虛寒者加砂仁木香炮姜溫而補之其食積成形者以前藥煎送保和丸大抵食積痞塊症為有形所謂邪氣勝則實真氣奪則虛惟當養正辟邪而積自除矣雖然堅者削之客者除之胃氣未虛或可少用若病久虛乏者則不宜用一婦人飲食後或腹脹或吞酸服枳朮丸吞酸益甚飲食日少胸膈痞滿腿內痠痛畏見風寒又服養胃湯一劑腿內作痛又二劑腿浮腫月經不行余以為鬱結所傷脾虛濕熱下注侵晨用四君芎歸二陳午後以前湯送越鞠丸飲食漸進諸症漸愈又用歸脾八珍二湯兼服兩月餘而經行一婦人性沉多慮月經不行胸滿少食或作脹或吞酸余以為中氣虛寒用補中益氣加砂仁香附煨姜二劑胸膈和而飲食進更以六君加芎歸貝母桔梗生薑大棗數劑脾胃健而經自調矣一婦人素有胃火服清胃散而安後因勞役躁渴內熱肌肉消瘦月經不行此胃火消爍陰血用逍遙散加丹皮炒梔以清胃熱用八珍湯加茯苓遠志以養脾血而經自行矣一婦人久患瘧形體怯弱內熱晡熱自汗盜汗飲食少思月事不行服通經丸虛症悉具此因虛而致瘧疾因瘧而致經閉用補中益氣及六味地黃丸各百餘劑瘧愈經自行一婦人久患瘧瘧作則經不行形虛脈大頭痛懶食大便泄瀉小便淋漓口乾唇裂內熱腹膨皆元氣下陷相火合病用補中益氣湯治之尋愈惟不時頭痛乃加蔓荊子而痛止又兼用六味地黃丸而經行一婦人因勞耳鳴頭痛體倦此元氣不足用補中益氣加麥門五味而痊三年後得子因飲食勞倦前症益甚月經不行晡熱內熱自汗盜汗用六味地黃丸補中益氣湯頓愈前症若因血虛有火用四物加山梔柴胡不應八珍加前藥若氣虛弱用四君子若怒耳便聾或鳴者實也小柴胡加芎歸山梔虛用補中益氣加山梔若午前甚作火治用小柴胡加炒連炒梔氣虛用補中益氣午後甚作血虛用四物加白朮茯苓若陰虛火動或兼痰甚作渴必用地黃丸以壯水之主經云頭痛耳鳴九竅不利腸胃之所生也脾胃一虛耳目九竅皆為之病一婦人胃氣素弱為哭母吐血咳嗽發熱盜汗經水三月不行余以為悲則傷肺思則傷脾遂朝服補中益氣加桔梗貝母知母夕用歸脾湯送地黃丸而愈帶下或因六淫七情或因醉飽房勞或因膏粱厚味或服燥劑所致脾胃虧損陽氣下陷或濕痰下注蘊積而成故言帶也凡此皆當壯脾胃升陽氣為主佐以各經見症之藥若屬肝則青小柴胡加山梔或濕熱壅滯小便赤澀龍膽瀉肝湯屬心則赤小柴胡加黃連山梔當歸屬肺則白補中益氣加山梔屬脾則黃六君子加山梔柴胡不應歸脾湯屬腎則黑六味地黃丸若氣血俱虛八珍湯陽氣下陷補中益氣湯濕痰下注前湯加茯苓半夏蒼朮黃柏氣虛痰飲下注四七湯送腎氣丸治驗一婦人年逾六十內熱口乾勞則頭暈吐痰帶下或用化痰行氣前症益甚飲食愈少肢體或麻恪服祛風化痰肢體常麻手足或冷或熱日漸消瘦余曰症屬脾氣虛弱而不能生肺祛風之劑復損諸經也當滋化源遂用補中益氣加茯苓半夏炮姜二十餘劑脾氣漸復飲食漸加諸症頓愈一孀婦腹脹脅痛內熱晡熱月經不調肢體痠麻不時吐痰或用清氣化痰喉間不利帶下青黃腹脅膨脹用行氣之劑胸膈不利肢體時麻此鬱怒傷損肝脾前藥益甚也朝用歸脾湯以解脾郁生脾氣夕用加味逍遙散以生肝血清肝火兼服百餘劑而諸症愈一婦人瘧久兼之帶下發後口乾倦甚余用七味白朮散加麥門五味作大劑煎與恣飲再發稍可乃用補中益氣加茯苓半夏十餘劑而愈凡截瘧余常以參術各一兩生薑四兩煨熟煎服即止或以大劑補中益氣加煨姜其功尤捷一婦人頭暈唾痰胸滿氣喘得食稍緩苦於白帶二十餘年矣諸藥不應余曰此氣虛而痰飲也飲愈而帶始愈遂用六味地黃丸不月而驗一婦人耳鳴胸痞內熱口乾咳中若有一核吞吐不利月經不調兼之帶下余以為肝脾鬱結用歸脾湯加半夏山梔升麻柴胡間以四七湯下白丸子而愈一婦人吞酸胸滿食少便泄月經不調服法制清氣化痰丸兩膝漸腫寒熱往來帶下黃白面黃體倦余以為脾胃虛濕熱下注用補中益氣倍用參術加茯苓半夏炮姜而愈若因怒發熱少食或兩腿赤腫或指縫常濕用六君加柴胡升麻及補中益氣一婦人帶下四肢無力勞則倦怠余曰四肢者土也此屬脾胃虛弱濕痰下注遂以補中益氣濟生歸脾二藥治之而愈一婦人年逾六十帶下黃白因怒胸膈不利飲食少思服消導利氣之藥反痰喘胸滿大便下血余曰此脾氣虧損不能攝血歸源也用補中益氣加茯苓半夏炮姜四劑諸症頓愈又用八珍加柴胡炒梔而安血分水分二症或因飲食起居失養或因六淫七情失宜以致脾胃虧損不能生髮統攝氣血乖違行失常道若先因經水斷絕後至四肢浮腫小便不通血化為水名曰血分宜用椒仁丸治之若先小便不利後至身面浮腫經水不通水化為血名曰水分宜用葶藶丸治之此屬形氣不足邪淫隧道必用此藥以宣導其邪而佐以輔補元氣庶使藥力有所仗而行則邪自不能容而真氣亦不至於復傷矣治驗一婦人月經不調晡熱內熱飲食少思肌體消瘦小便頻數服濟陰丸月經不行四肢浮腫小便不通余曰此血分也朝用椒仁丸夕用歸脾湯漸愈乃以人參丸代椒仁丸兩月餘將愈專用歸脾湯五十餘劑而痊一癧婦月經不調小便短少或用清熱分利之劑小便不利三月餘身面浮腫月經不通余曰此水分也遂朝用葶藶丸夕用歸脾湯漸愈乃用人參丸間服而愈已上二症作脾虛水氣用分利等藥而歿者多矣惜哉小便出血婦人小便尿血或因膏粱炙煿或因醉飽入房或因飲食勞役或因六淫七情以致元氣虧損不能統攝歸源若因怒動肝火者用加味逍遙散調送發灰肝經風熱者送子芩丸久而血虛者用八珍送發灰若膏粱積熱者用清胃散加槐花甘草房勞所傷者用六君加柴胡升麻風熱所傷者用四君加防風枳殼凡久而虧損元氣者用補中益氣為主鬱結傷脾者用濟生歸脾為主治驗一婦人尿血因怒氣寒熱或頭痛或脅脹用加味逍遙諸症稍愈惟頭痛此陽氣虛用補中益氣加蔓荊子而痊後鬱怒小腹內㽲痛次日尿血熱甚仍用前散加龍膽草並歸脾湯將愈因飲食所傷血仍作徹夜不寐心忡不寧此脾血尚虛用前湯而痊一婦人尿血久用寒涼止血藥面色痿黃肢體倦怠飲食不甘晡熱作渴三年矣此前藥復傷脾胃元氣下陷而不能攝血也蓋病久鬱結傷脾用補中益氣以補元氣用歸脾湯以解脾郁使血歸經更用加味逍遙以調養肝血不月諸症漸愈三月而痊熱入血室婦人傷寒或勞役或怒氣發熱適遇經行以致熱入血室或血不行或血不止令人晝則明瞭安靜夜則譫語如見鬼狀用小柴胡加生地黃血虛者用四物加生地柴胡切不可犯胃氣若病既愈而血未止或熱未已元氣素弱用補中益氣脾氣素郁用濟生歸脾血氣素弱用十全大補庶無誤矣治驗一婦人經行感冒風寒日間安靜至夜譫語用小柴胡加生地治之頓安但內熱頭暈用補中益氣加蔓荊子而愈後因怒惱寒熱譫語胸脅脹痛小便頻數月經先期此是肝火血熱妄行用加味逍遙加生地而愈一婦人因怒寒熱頭痛譫言妄語日晡至夜益甚而經暴至蓋肝藏血此怒動火而血妄行用加味逍遙散加生地治之神思頓清但食少體倦月經未已蓋脾統血此脾氣虛不能攝用補中益氣治之月經漸止一婦人懷抱素郁感冒經行譫語服發散之劑不應用寒涼降火前症益甚更加月經不止肚腹作痛嘔吐不食痰涎自出此脾胃虛寒用香砂六君脾胃漸健諸症漸退又用歸脾湯而痊愈師尼寡婦寒熱宋褚氏療師尼寡婦別制方藥謂獨陰無陽致血氣交爭乍寒乍熱如瘧或腰背作痛而寒熱其肝脈弦出寸口是其症也若室女出嫁愆期而寒熱亦然蓋男子精盛則思室女子血盛以懷胎此天地自然之理也治以小柴胡加生地久而血虛佐以四物若兼怒動肝火而寒熱者佐以加味逍遙散若兼虧損肝經而寒熱者佐以八珍湯若兼虧損元氣而寒熱者佐以補中益氣湯若兼郁傷脾氣而寒熱者佐以濟生歸脾湯此症多兼經候不調當詳孰為緩急而治之治驗一寡婦因怒致不時寒熱久而不已肝脈弦緊用小柴胡加生地治之而愈但見風寒熱仍作此是脾胃氣虛用加味歸脾補中益氣二湯兼服而止一婦人因夫經商久不歸發寒熱月經旬日方止服降火涼血反潮熱內熱自汗盜汗月經頻數余曰熱汗氣血虛也經頻肝脾虛也用歸脾湯六味丸而愈常治兼症既愈而寒熱當仍用本症藥一室女寒熱左手脈弦長而出寸口用小柴胡加生地烏梅治之而愈既嫁而諸症悉痊一室女久患寒熱月經不調先以小柴胡加生地治之少愈更以生地黃丸而痊一放出宮女年逾三十兩胯作痛肉色不變大小便中作痛如淋登廁尤痛此瘀血漬入隧道為患乃男女失合之症也難治後潰不斂又患瘰癧而歿此婦為吾鄉湯氏妾湯為商常在外可見此婦在內久懷憂鬱及出外又不能如願是以致生此疾愈見瘰癧流注乃七情氣血損傷不可用攻伐皎然矣按精血篇云女人天癸既至逾十年無男子合則不調未逾十年思男子合亦不調不調則舊血不出新血誤行或漬而入骨或變而為腫或雖合而難子合多則瀝枯虛人產乳眾則血枯殺人觀其精血思過半矣一室女年十七癧久不愈天癸未通發熱咳嗽飲食少思或欲用通經丸余曰此症潮熱經候不調者不治所喜脈不澀且不潮熱尚可治但養氣血益津液其經自行惑於速效仍用之余曰非其治也此乃慓悍之劑大助陽火陰血得之則妄行脾胃得之則愈虛經果通而不止飲食愈少更加潮熱遂致不救歷節痛風即白虎歷節風歷節痛或因飲食起居失節或因七情六淫失宜以致脾胃虧損腠理不密外邪所侵或為肝火內動肝血耗損或為肢體疼痛或為肢節難伸或為卒然制痛或為走痛無常或內熱晡熱自汗盜汗或經候不調飲食不甘其治法屬風邪者小續命湯走注疼痛者漏蘆散骨節疼痛者四生丸濕熱痛者清燥湯兼痰佐以二陳肝火者加味逍遙散加羌活川芎脾郁者加味歸脾加羌活川芎血虛者四物加羌活川芎氣虛者四君加羌活川芎氣血俱虛者八珍加羌活川芎月經先期而痛者加味逍遙散為主月經過期而痛者補中益氣為主大抵痛而不敢按者屬病氣元氣俱實也手按而痛緩者病氣元氣俱虛也若勞役而作痛者元氣虛也飲食失宜而作痛者脾胃虛也怒惱而作痛者肝火也經行而作痛血虛也凡此皆固元氣為主而佐以治病之藥治驗一婦人自汗盜汗發熱晡熱體倦少食月經不調吐痰甚多二年矣遍身作痛天陰風雨益甚用小續命湯而痛止用補中益氣加味歸脾二湯三十餘劑而愈自汗等症皆鬱結傷損脾氣不能輸養諸臟所致故用前二湯專主脾胃若用寒涼降火理氣化痰復傷生氣多致不起一婦人因怒月經去多發熱作渴左目緊小頭項動掉四肢抽搐遍身疼痛此怒動肝火肝血虛而內生風用加味逍遙加鉤藤數劑諸症漸愈又用八珍湯調理而痊一婦人月經先期素有痛症每勞必作用眾手重按痛稍止此氣血虛而有火用十全大補加獨活治之而痛痊用六味丸逍遙散而經調一婦人歷節作痛發熱作渴飲食少思月經過期諸藥不應脈洪大按之微細用附子八物四劑而痛止用加味逍遙而元氣復六味丸而月經調一婦人體肥胖素內熱月經先期患痛風下身微腫痛甚小便頻數身重脈緩症屬風濕而血虛有熱先用羌活勝濕湯四劑腫痛漸愈用清燥湯數劑小便漸清用加味逍遙十餘劑內熱漸愈為飲食停滯發熱仍痛面目浮腫用六君加柴胡升麻而愈又因怒氣小腹痞悶寒熱嘔吐此木侮脾土用前藥加山梔木香而安惟小腹下墜似欲去後此脾氣下陷用補中益氣而愈後因勞役怒氣作嘔吐痰遍身腫痛月經忽來寒熱用六君加柴胡山梔以扶元氣清肝火腫痛嘔吐悉退用補中益氣以升陽氣健營氣月經寒熱悉瘥一婦人飲食少思畏見風寒患痛風嘔吐寒熱脈弦緊用附子八物四肢痛愈用獨活寄生腰痛亦痊惟兩膝腫痛用大防風而消用加味歸脾逍遙而元氣復流注婦人流注或因憂思鬱怒虧損肝脾或因產後勞役復傷氣血以致營氣不從逆於肉理或因腠理不密外邪客之或濕痰流注或跌撲血滯或產後惡露蓋氣流而注血注而凝或生於四肢關節或流於胸腹腰臀或結塊或漫腫皆屬虛損急用蔥熨及益氣養榮湯則未成自消已成自潰若久而腫起作痛肢體倦怠病氣有餘形氣不足尚可治若漫腫微痛屬形氣病氣俱不足最難治不作膿或膿成不潰氣血虛也用八珍湯憎寒畏寒陽氣虛也十全大補湯晡熱內熱陰血虛也四物加參術作嘔欲嘔胃氣虛也六君加炮姜食少體倦脾氣虛也補中益氣加茯苓半夏四肢逆冷小便頻數命門火衰也八味丸小便頻數痰盛作渴腎水虧損也六味丸月經過期多日不止肝脾虛也八珍湯加柴胡丹皮凡潰而氣血虛弱不斂者更用十全大補湯煎膏外補之久潰而寒邪凝滯不斂者用豆豉餅祛散之其潰而內有膿管不斂者用針頭散腐化之自愈若不補氣血不節飲食不慎起居不戒七情或用寒涼克伐俱不治治驗一婦人左臂患之年許不潰堅硬不痛肉色不變脈弱少食月經過期日晡發熱勞役則痛遂與參耆歸朮川芎芍藥熟地貝母遠志香附桔梗丹皮甘草百餘貼而消一婦人暴怒腰腫一塊胸膈不利時或氣走作痛與方脈流氣飲數劑而止更以小柴胡對四物加香附貝母月餘而愈一婦人因怒脅下腫痛胸膈不利脈沉滯以方脈流氣飲數劑少愈以小柴胡對二陳加青皮桔梗貝母數劑頓退更以小柴胡湯對四物二十餘劑而痊一婦人因閃胸肩患腫遍身痛遂以黑丸子二服而痛止以方脈流氣飲二劑而腫消更以二陳對四物加香附枳殼桔梗而痊愈一婦人腿患筋攣骨痛諸藥不應脈遲緊用大防風湯二劑頓退又二劑而安又一婦患之亦然先用前湯二劑更服黑丸子而痊此二患若失治潰成敗證一婦人潰後發熱予以為虛彼不信乃服敗毒藥果發大熱竟至不救夫潰瘍雖有表證發熱宜以托裡為主佐以表散之劑何況瘰癧流注乎若氣血充實經絡通暢決無患者此證之因皆由氣血素虧或七情所傷經絡鬱結或腠理不密六淫外侵隧道壅塞若不審其所因辨其虛實鮮不誤人瘰癧婦人瘰癧或因胎產血崩虧損腎肝或因憂思鬱怒傷損肝脾或因恚怒風熱肝膽血燥或因水涸血虛筋攣則累累然如貫珠故多生於耳前後項側胸脅間若寒熱腫痛乃肝經氣動而為病用柴胡梔子散以清肝火為主而佐以逍遙散以養肝血若寒熱既止而核不消乃肝經之血亦病用加味四物湯以養肝血為主而佐以柴胡梔子散以清肝火若初生如豆粒附著於筋肉色不變內熱口乾精神倦怠久不消潰乃肝脾虧損用逍遙散歸脾湯六味丸健脾土培肝木切不可輕用散堅追毒之劑外臺秘要云肝腎虛熱則生癧矣病機云瘰癧不繫膏粱丹毒因虛勞氣鬱所致補形氣調經脈其瘡當自消散誤下之先犯病禁經禁若久潰脈浮大邪火盛也而色㿠白金剋木也皆不治若赤脈貫瞳子有幾條則幾年死治驗一婦人久而不愈或以為木旺之症用散腫潰堅湯伐之腫硬益甚余以為肝經氣血虧損當滋化源用六味地黃丸補中益氣湯至春而愈此症若肝經風火暴病元氣無虧宜用前湯若風不旺而自病宜用瀉青丸虛者用地黃丸若水不能生木亦用此丸若金來剋木宜補脾土生腎水大凡風木之病但壯脾土則木自不能克矣若行伐肝則脾胃先傷而木反來剋土矣一婦人患之恐不起致少寐年餘癧破膿水淋漓經水或五十日或兩月餘一至誤服通經丸展轉無寐午前惡寒午後發熱余以為思慮虧損脾血用歸脾湯作丸午前以六君子送下午後以逍遙散送下兩月餘得寐半載後經行如期年餘而瘡愈一癧婦潰後發熱煩躁作渴脈大而虛以當歸補血湯六劑而寒熱退又以聖愈湯數劑而痊愈更以八珍加貝母遠志三十餘劑而斂一婦人項結核寒熱頭痛脅乳脹痛內熱口苦小便頻數症屬肝火血虛用四物加柴胡山梔膽草而愈又用加味逍遙散而安一婦人瘰癧後遍身作癢脈大按而虛以十全大補加香附治之而愈大凡潰後午前癢作氣虛午後癢作血虛若作風症治之必死一婦人項核腫痛察其氣血俱實先以必效散一服下之更以益氣養榮湯補之三十餘劑而消常治此症若必欲出膿但虛弱者先用前湯待其氣血稍充乃用必效散去其毒仍用補藥無不效未成膿者灸肘尖調經解鬱及隔蒜灸多自消有膿即針之若氣血復而核不消卻服散堅之劑月許不應氣血不損須用必效散其毒一下即多服益氣養榮湯如不應亦灸肘尖如瘡口不斂者更用豆豉餅琥珀膏若氣血俱虛或不慎飲食七情者不治然此症以氣血為主氣血壯實不用追蝕之劑亦能自腐但取去使易於收斂耳血虛而用追蝕不惟徒治適足以敗矣乳癰乳岩婦人乳癰屬膽胃二腑熱毒氣血壅滯故初起腫痛發於肌表肉色焮赤其人表熱發熱或發寒熱或憎寒頭痛煩渴引冷用人參敗毒散神效栝蔞散加味逍遙散治之其自消散若至數日之間膿成潰竅稠膿湧出膿儘自愈若氣血虛弱或誤用敗毒久不收斂膿清脈大則難治乳岩屬肝脾二臟鬱怒氣血虧損故初起小核結於乳內肉色如故其人內熱夜熱五心發熱肢體倦瘦月經不調用加味歸脾湯加味逍遙散神效瓜蔞散多自消散若荏苒日月漸大山㕘岩色赤出水腐潰深洞用前歸脾湯等藥可延歲月若誤用攻伐危殆迫矣大凡乳症若因恚怒宜疏肝清熱焮痛寒熱宜發表散邪腫焮痛甚宜清肝消毒並隔蒜灸不作膿或膿不潰補氣血為主不收斂或膿稀補脾胃為主膿出反痛或發寒熱補氣血為主或晡熱內熱補血為主若飲食少思或作嘔吐補胃為主飲食難化或作泄瀉補脾為主勞碌腫痛補氣血為主怒氣腫痛養肝血為主兒口所吹須吮通揉散成癰治以前法潮熱暮熱亦主前藥大抵男子多由房勞耗傷肝腎婦人鬱怒虧損肝脾治者審之世以孕婦患此名曰內吹然其所致之因則一惟用藥不可犯其胎耳治驗一婦人內熱脅脹兩乳不時作痛口內不時辛辣若臥而起急則臍下牽痛此帶脈為患用小柴胡加青皮黃連山梔二劑而瘥一婦人因怒兩乳腫兼頭痛寒熱用人參敗毒散二劑表症已退用小柴胡加芎歸枳殼桔梗四劑而消一婦人久郁右乳內腫硬用八珍湯加遠志貝母柴胡青皮及隔蒜灸兼服神效栝蔞散兩月餘而消一婦人左乳內腫如桃不痛不赤發熱漸瘦用八珍加香附遠志青皮柴胡百餘劑又兼服神效栝蔞散三十餘劑膿潰而愈一婦人郁久左乳內結核如杏許三月不消心脈澀而脾脈大按之無力以八珍加貝母遠志香附柴胡青皮桔梗五十餘劑而潰又三十餘劑而愈一婦人稟實性躁懷抱久郁左乳內結一核按之微痛以連翹飲子二十餘劑少退更以八珍加青皮香附桔梗貝母二十餘劑而消一婦人發熱作渴至夜尤甚兩乳忽腫肝脈洪數乃熱入血室也用加味小柴胡湯熱止腫消一婦人因怒左乳作痛發熱表散太過腫熱益甚用益氣養榮湯數劑熱止膿成不從用針腫脹熱渴針膿大泄仍以前湯月餘始愈此症若膿成未破有薄皮剝起者用代針之劑其膿自出不若及時用針不致大潰若膿血未盡輒用生肌反助其邪慎之一婦人因怒左乳作痛胸膈不利以方脈流氣飲加木香青皮四劑而安一婦人膿清腫硬面黃食少內熱晡熱自汗盜汗月經不行此肝脾氣血俱虛用十全大補加遠志貝母及補中益氣各三十餘劑外用蔥熨患處諸症尋愈一婦人膿成脹痛余欲針之不從數日始針出敗膿三四碗許虛症蜂起幾至危殆用大補兩月餘而安若元氣虛弱不作膿者用益氣養榮湯補之膿成即針若腫痛寒熱怠惰食少或至夜熱甚用補中益氣湯兼逍遙散補之為善一產婦因乳少服藥通之致乳房腫脹發熱作渴以玉露散補之而愈夫乳汁乃氣血所化在上為乳在下為經若衝任之脈盛脾胃之氣壯則乳汁多而濃衰則淡而少所乳之子亦弱而多病又有屢產無乳或大便澀滯乃亡津液也當滋化源一婦人右乳內結三核年餘不消朝寒暮熱飲食不甘此乳岩以益氣養榮湯百餘劑血氣漸復更以木香餅熨之喜其謹疾年餘而消至英內年二十有五素虛弱多鬱怒時疫後脾胃愈虛飲食愈少又值氣忿右乳脅下紅腫膺內作痛用炒麩皮熨之腫雖少散內痛益甚轉側胸中如物懸墜遂與加減四物湯內腫如鵝卵外大如盤胸脅背心相引而痛夜熱勢甚時治者皆以攻毒為言叩諸先生乃云此病後脾弱而復怒傷肝治法惟主於健脾氣平肝火則腫自消而病自愈矣承惠方以八物加陳皮黃耆柴胡山梔白芷服八劑病減六七去白芷加青皮木香桔梗又六劑而痊愈奏功之奇獲效之速蓋出於尋常萬萬也感激厚恩昕夕不忘錄此乞附醫案以詔後之患者毋為攻毒者之所惑也晚生尤至英頓首再拜書一婦人乳內結核年餘晡熱少食余欲用益氣養榮湯治之彼以為緩乃服行氣之劑其勢愈甚潰而日出清膿而歿郭氏妾乃放出宮女乳內結一核如慄亦服流氣等藥大如覆碗堅硬如石出水而歿血風瘡婦人血風瘡因肝脾二經風熱鬱火血燥所致其外症身發疙瘩或如丹毒癢痛不常搔破成瘡膿水淋漓其內症月經無定小便不調夜熱內熱自汗盜汗惡寒憎寒肢體倦怠飲食不甘寒熱往來若發熱作痛乃肝經風熱血燥用當歸飲加柴胡山梔若體倦食少口乾潮熱乃肝脾鬱火傷血用加味逍遙散若疙瘩痛癢寒熱往來乃肝經風熱傷血用小柴胡加山梔黃連若夜間發熱作渴譫語乃熱入血室用小柴胡加生地黃血虛四物合小柴胡湯若無寐盜汗內熱晡熱乃脾經血虛用歸脾湯兼寒熱加山梔熟地若用風藥復傷陰血反致他症治驗一婦人素清苦四肢患此誤用敗毒寒涼晡熱內熱自汗盜汗月經不行口乾咽燥此鬱結傷脾四肢者脾主之用歸脾湯數劑後兼逍遙散五十餘劑而愈一婦人性躁寒熱口苦脅痛耳鳴腹脹溺澀年餘矣症屬肝火用四君加柴胡炒山梔炒龍膽數劑乃與逍遙散兼服而瘡愈又與六味丸及逍遙散七十餘劑諸症悉退若有愈後身起白屑搔則肌膚如帛所隔此氣血虛不能營於腠理用大補之劑若有愈後發熱身起疙瘩癢痛搔破膿水淋漓經候不調此肝火血熱用四物加柴胡山梔白朮茯苓丹皮甘草一婦人日晡身癢月餘口乾又月餘成瘡服祛風之劑膿水淋漓午前畏寒午後發熱殊類風症余謂此肝經鬱火外邪所搏用補中益氣加山梔鉤藤又以逍遙散加川芎貝母而愈一婦人搔癢發熱日晡益甚膚見赤痕月經過期此血虛有熱以逍遙散倍加熟地熱止癢退更以四物加參耆柴胡炙草茯苓調理遂愈一女子十二歲善怒遍身作癢用柴胡川芎山梔芍藥以清肝火以生地當歸黃芩涼肝血以白朮茯苓甘草健脾土而愈半載後遍身起赤痕或時眩暈此肝火熾甚血得熱而妄行是夜果經至臁瘡婦人兩臁生瘡或因胎產飲食失宜傷損脾胃或因憂思鬱怒虧損肝脾以致濕熱下注或外邪所侵外臁屬足三陽可治內臁屬足三陰難治若初起發腫赤痛屬濕毒所乘用人參敗毒或檳蘇敗毒散若漫腫作痛或不腫不痛屬脾虛濕熱下注用補中益氣或八珍湯若膿水淋漓體倦少食內熱口乾屬脾氣虛弱用補中益氣加茯苓酒炒芍藥若午後頭目不清屬陰火用前湯加酒炒黑黃柏若午後發熱體倦屬血虛用前湯加川芎熟地若懷抱不樂而甚用歸脾湯加山梔柴胡若恚怒氣逆而甚用補中益氣加川芎山梔若內熱體倦痰涎口瘡屬脾腎虛熱用六味丸若肢體畏寒飲食少思屬脾腎虛寒用八味丸大抵色赤屬熱毒易治色黯屬脾腎虛寒難治設誤用攻伐復傷胃氣難保其生治驗一婦人患之四畔微赤作痛重墜膿水淋漓胸膈不利飲食少思內熱口苦夜間少寐此屬脾虛郁傷用歸脾湯解鬱結而生脾血用補中益氣加茯苓半夏補脾氣而除濕熱尋愈一婦人久不愈色赤微熱日晡焮腫形體虛弱飲食少思勞則喘渴惡寒發熱此脾虛下陷用補中益氣湯而愈一婦人三年矣色黯腫硬惡寒發熱飲食少思形體消瘦作渴飲湯飲食稍多或腹脹或泄瀉或作嘔或吞酸此脾氣虛寒用補中益氣加乾薑肉桂五十餘劑而愈一婦人因入朝步履惡寒發熱倦怠懶食瘡口出血此勞傷元氣不能攝血歸經用補中益氣湯而愈一婦人因怒寒熱頭眩或耳項胸脅脹痛或小腹陰道悶墜或小便頻數下血此屬肝火血熱先用小柴胡湯加炒黑山梔川芎當歸車前二劑諸症頓退又用加味逍遙散補其陰血而愈後因飲食勞倦前症復作瘡口出血用補中益氣湯治之而愈一婦人患將兩月焮赤腫痛小便頻數飲食如常用活命飲二劑諸症悉愈又用八珍湯而痊一婦人患此焮痛惡寒發熱用檳蘇敗毒散而寒熱退用仙方活命飲而焮痛止再用補中益氣湯而形氣健陰瘡交接出血陰挺陰癢陰蟲附婦人陰瘡乃七情鬱火傷損肝脾濕熱下注其外症有陰中舒出如蛇俗呼陰挺有翻突如餅俗呼陰菌亦有如雞冠花亦有生諸蟲亦有腫痛濕癢潰爛出水脹悶脫墜者其內症口乾內熱體倦經候不調飲食無味晡熱發熱胸膈不利脅肋不調小腹痞脹赤白帶下小水淋澀其治法腫痛者宜用四物加柴胡山梔丹皮膽草濕癢者宜用歸脾加山梔丹皮柴胡淋澀者宜用龍膽瀉肝加白朮丹皮潰腐者宜用加味逍遙散腫悶脫墜者宜用補中益氣加山梔丹皮佐以外治之法備見治驗治驗一婦人胸膈不利內熱作渴飲食不甘肢體倦怠陰中悶癢小便赤澀此鬱怒所致用歸脾加山梔而愈後因怒患處並小腹脹痛用小柴胡加山梔芎歸芍藥而愈但內熱晡熱用逍遙散加山梔而愈後因勞役發熱患處腫脹小便仍澀用補中益氣加山梔茯苓丹皮而愈一婦人陰中突出如菌四圍腫痛小便頻數內熱晡熱似癢似痛小腹重墜此肝脾鬱結之症蓋肝火濕熱而腫痛脾虛下陷而重墜也先以補中益氣加山梔茯苓車前青皮以清肝火升脾氣漸愈更以歸脾湯加山梔茯苓川芎調理更以生豬脂和藜蘆末塗之而收入一婦人陰中挺出一條五寸許悶痛重墜水出淋漓小便澀滯夕與龍膽瀉肝湯分利濕熱朝與補中益氣湯升補脾氣諸症漸愈再與歸脾加山梔茯苓川芎黃柏間服調理而愈後因勞役或怒氣下部濕癢小水不利仍用前藥即愈亦有尺許者亦有生諸蟲物者皆用此治一婦人腐潰膿水淋漓腫痛寒熱小便赤澀內熱作渴肢體倦怠胸脅不利飲食少思三月餘矣用補中益氣內柴胡升麻各用一錢加茯苓一錢炒山梔二錢數劑少愈又與歸脾加山梔川芎茯苓三十餘劑諸症悉退惟內熱尚在再與逍遙散倍用山梔而愈一婦人素性急陰中或痛小便赤澀怒則益甚或發熱或寒熱治以芎歸炒梔柴胡苓朮丹皮澤瀉炒芍炒車前炒連生草數劑漸愈乃去黃連澤瀉又數劑而痊愈一婦人素鬱悶陰內痛癢不時出水飲食少思肢體倦怠用歸脾加丹皮山梔芍藥柴胡生草主之而安一婦人陰內癢痛內熱倦怠飲食少思用參耆歸朮陳皮柴胡炒梔炒車前升麻芍藥丹皮茯苓治之而瘥若陰中有蟲癢痛亦屬肝木以桃仁研膏和雄黃末納陰中以殺之仍用清肝解鬱有以雞肝納之者乃取蟲之法也一婦人交接違理出血作痛發熱口乾誤服寒涼之劑前症益甚不時欲嘔飲食少思此症屬肝經而藥復傷脾也先用六君子加柴胡而脾胃漸愈乃用加味逍遙散而患處亦痊一婦人每交接輒出血作痛敷服皆涼血止痛之劑不時出血甚多此肝傷而不能藏血脾傷而不能攝血也用補中益氣濟生歸脾二湯而愈若交接出血用熟艾熱裹入陰中若交接違理而出血用亂髮青布燒為末敷之血自止若出血過多而見他症但用前藥調補肝脾諸症自愈矣一婦人陰腫下墜悶痛出水胸腹不利小便頻數內熱晡熱口苦耳鳴先用小柴胡加車前膽草苓朮升麻二劑稍緩又用加味逍遙加升麻數劑稍愈乃以加味歸脾加升麻柴胡並補中益氣加山梔數劑漸愈仍用加味逍遙加味歸脾二藥調理而瘥一婦人熱痛用寒涼敗毒飲食不入時欲嘔吐小腹重墜似欲去後此脾胃虧損元氣下陷症屬虛寒先用補中益氣加炮姜二劑重墜若失再用前湯加茯苓半夏二十餘劑而愈乃以歸脾少加柴胡升麻六味地黃丸調理兩月餘而康附方並注保和丸治飲食停滯胸膈痞滿或作吞酸等症山楂取肉二兩蒸神麯炒半夏茯苓各一兩蘿蔔子炒陳皮連翹各五錢上為末粥丸加白朮二兩名大安丸越鞠丸治六郁胸膈痞滿嘔吐吞酸或濕熱腹脹腿腳痠疼等症蒼朮炒神麯炒香附山楂山梔炒撫芎麥芽炒各等分上各另為末水調炒曲面糊為丸桐子大每服五七十丸白滾湯下左金丸一名四今丸治肝火胸脅刺痛或發寒熱或頭目作痛小便淋秘或小腹疼痛一切肝火之症黃連六兩吳茱萸一兩湯煮片時用上為末粥丸白朮陳皮湯下椒仁丸治先因經水斷絕後至四肢浮腫小便不通血化為水椒仁續隨子去皮研甘遂附子炮郁李仁黑牽牛五靈脂研碎當歸吳茱萸延胡索各五錢芫花醋浸一錢石膏蚖青十枚去頭翅足同糯米炒黃去米不用斑蝥十個糯米炒黃去米不用膽礬人言各一錢上為末麵糊為丸如豌豆大每服一丸橘皮湯下此方藥雖峻利所用不多若畏而不服有養病害身之患常治虛弱之人亦未見其有誤也血分葶藶丸治先因小便不利後至身面浮腫經水不通水化為血葶藶研炒續隨子去殼各半兩研干筍末一兩上為末棗肉丸如桐子大每服七丸煎匾竹湯下如大便利者減續隨子葶藶各一錢加白朮五錢人參丸治經脈不利化為水流走四肢悉皆腫滿名曰血分其候與水相類若作水治之非也宜用此人參大黃濕紙裹飯上蒸熟去紙切炒當歸桂心瞿麥穗赤芍藥白茯苓各半兩葶藶炒另研一錢上為末煉蜜丸桐子大每服十五丸至二三十丸空心飲湯下柏子仁丸治血虛有火月經耗損漸至不通日漸羸瘦而生潮熱慎毋以毒藥通之宜柏子仁丸澤蘭湯主之柏子仁炒砂牛膝酒拌卷柏各半兩澤蘭葉續斷各二兩熟地黃用生者三兩酒拌蒸半日忌鐵器杵膏上為末入地黃膏加煉蜜丸桐子大每服三十丸空心米飲下澤蘭湯治症同前澤蘭葉三兩當歸酒拌芍藥炒各一兩甘草五錢上為粗末每服五錢水二鍾煎至一鍾去渣溫服獨參湯治一切失血惡寒發熱作渴煩躁並宜此藥補氣蓋血生於氣陽生陰長之理也用人參二兩棗十枚水煎服玉露散治乳脈不行身體壯熱頭目昏痛大便澀滯等症人參白茯苓桔梗炒川芎白朮當歸芍藥各一錢甘草五分上水煎服若熱甚大便秘量加炒大黃聖愈湯治血虛心煩睡眠不寧或五心煩熱地黃酒拌蒸半日生地黃酒拌川芎人參各五錢當歸酒拌黃耆炒各一錢上水煎服當歸飲治血熱癮疹癢痛膿水淋漓發熱等症當歸白芍藥川芎生地黃白蒺藜各一錢防風荊芥各五分黃耆一錢何首烏甘草各五分上水煎服龍膽瀉肝湯治肝經濕熱下部腫焮作痛小便澀滯陰挺如菌或出物如蟲等症龍膽草酒拌炒黃澤瀉各一錢車前子炒木通生地黃酒拌當歸尾酒拌山梔炒黃芩生甘草各五分上水煎服烏賊魚骨丸治婦人血枯胸膈四肢滿妨於食飲病至聞腥臊臭氣先唾血出清液或前後泄血目眩轉月事衰少不來烏賊魚骨去甲四兩䕡茹一兩上為末以雀卵和成劑丸如小豆大每服五丸加至十丸以鮑魚煎湯下以飯壓之青州白丸子治風痰咳嗽或牙關緊急不知人事或痰滯作麻南星三兩半夏七兩白附子二兩川烏半兩各生用上為末絹袋盛井水擺浸仍換水浸三五日曬乾糯米粉丸如急用以薑汁糊丸亦可四七湯治七情鬱結咽間如有一核吞吐不利或中脘痞滿痰涎壅喘或噁心少食紫蘇葉一錢厚朴一錢五分茯苓一錢半夏薑製七分上薑棗水煎服若白帶以此湯送前丸其效如神當歸龍薈丸治肝經症脅下作痛或有積塊或下疳便癰小便淋澀或瘀血凝滯小腹作痛當歸酒拌龍膽草酒拌炒梔子仁炒黃連青皮黃芩各一兩大黃酒拌炒蘆薈青黛柴胡各五錢木香二錢五分麝香五分另研上為末炒神麯糊丸每服二三十丸薑湯下阿魏膏治一切痞塊羌活獨活玄參官桂赤芍藥川山甲生地黃兩頭尖大黃白芷天麻各五錢紅花四錢槐柳桃枝各三錢木鱉子三十枚去殼亂髮如雞子大一塊上用香油二斤四兩煎黑去柤入發再煎化仍去柤徐下黃丹煎軟硬得中方入芒硝阿魏蘇合油乳香沒藥五錢麝香三錢調勻成膏矣攤貼患處內服蘆薈丸等黃丹須真正者效凡貼膏藥先用朴硝隨患處鋪半指厚以紙蓋用熱熨斗熨良久如消耗再加熨之熨二時許方貼膏藥若是肝積加蘆薈末同熨蘆薈丸治肝疳口舌生瘡牙齦腐爛或遍身生瘡等症大皂角青黛蘆薈研硃砂研麝香研各一錢干蝦蟆用皂角各等分燒存性為末一兩入前項藥上為末蒸餅糊丸麻子大每服五七十丸米飲下局方小續命湯治歷節痛風痰盛口噤腰背反張等症防己肉桂去粗皮杏仁去皮尖炒黃黃芩白芍甘草川芎麻黃去節人參去蘆各一兩附子炮去皮臍半兩防風一兩五錢上為粗末每服三錢薑棗水煎服調中益氣湯治體怠嗜臥不思飲食或痰嗽泄瀉等症黃耆一錢人參去蘆頭甘草蒼朮各五分柴胡橘皮升麻木香各二分上薑棗水煎空心服佛手散治妊娠傷胎下血當歸三錢川芎二錢上水煎食前服木香餅治一切氣滯結腫或痛或閃肭及風寒所傷作痛並效木香五錢生地黃一兩上木香為末地黃杵膏和勻量患處大小作餅置患處以熱熨斗熨之隔蒜灸法治一切瘡毒大痛或不痛或麻木如痛者灸至不痛不痛者灸至痛其毒隨火而散蓋火以暢達拔引郁毒此從治之法也有回生之功用大蒜頭去皮切三文錢厚安瘡頭上用艾壯於蒜上灸之三壯換蒜復灸未成者即消已成者亦殺其大勢不能為害如瘡大用蒜搗爛攤患處將艾鋪上燒之蒜敗再換如不痛或不作膿及不起發或陰瘡尤宜多灸灸而仍不痛不作膿不起發者不治此氣血虛極也神效蔥熨法治虛怯人肢體患腫塊或作痛或不痛或風襲於經絡肢體疼痛或四肢筋攣骨痛又治流注跌撲傷損腫痛用蔥頭細切杵爛炒熱敷患處冷易之再熨腫痛即止其效如神豆豉餅治瘡瘍腫硬不潰及潰而不斂並一切頑瘡惡瘡用江西豆豉為末唾津和作餅子如錢大厚如三文置患處以艾壯於餅上灸之干則易之如背瘡用嗽口水調作餅覆患處以艾鋪餅上灸之如未成者即消已成者能消其毒如有不效氣血虛敗也益氣養榮湯治抑鬱瘰癧或四肢患腫肉色不變或日晡發熱或潰而不斂人參茯苓陳皮貝母香附當歸酒拌川芎黃耆鹽水拌炒熟地黃酒拌芍藥炒各一錢甘草炙桔梗炒各五分白朮炒二錢上姜水煎服人參養榮湯治潰瘍發熱惡寒四肢倦怠體瘦少食面黃短氣不能收斂若大瘡愈後多服之不變他病白芍藥一錢五分人參陳皮黃耆蜜炙桂心當歸酒拌白朮甘草炙各一錢熟地黃酒拌五味子炒茯苓各七分半遠志去心炒五分上薑棗水煎服方脈流氣飲子治惱怒胸膈脹滿或肢體作痛或結壅腫血氣無虧者紫蘇葉青皮苦梗半夏煨當歸芍藥烏藥茯苓川芎黃耆枳殼去穰麩炒防風各半兩甘草橘皮各五分大腹皮木香各三分上薑棗水煎服瀉青丸治肝經鬱火實熱脅乳作痛大便秘結及肝經一切實火症當歸龍膽草川芎山梔大黃羌活防風各等分上為末蜜丸雞子大每服一二丸人參敗毒散治瘡瘍焮痛發寒熱或拘急頭痛等症人參羌活獨活前胡柴胡桔梗枳殼茯苓川芎甘草各一錢上水煎服生地黃丸治師尼寡婦乍寒乍熱肝脈弦長而出魚際生地黃一兩酒拌杵膏秦艽黃芩硬柴胡各五錢赤芍藥一兩上為細末入地黃膏加煉蜜少許丸桐子大每服三十丸烏梅煎湯下日進二服亦治室女患此連翹飲子治乳內結核連翹川芎栝蔞仁研皂角刺炒橘葉青皮去白甘草節桃仁各一錢半上水煎服必效散治瘰癧未成膿者自消已潰者自斂南鵬砂二錢五分輕粉一錢斑蝥四十個糯米同炒熟去頭翅麝香五分巴豆五粒去殼心膜白檳榔一個上為細末每服一錢五更用滾湯調下如小水澀滯或微痛此癧毒欲下也進益元散一服即下此方斑蝥巴豆似為峻厲然用巴豆乃解斑蝥之毒用者勿畏琥珀膏治頸項瘰癧及腋下初如梅子腫結硬強漸如連珠不消不潰或潰而膿水不絕經久不瘥漸成漏症琥珀一兩木通桂心當歸白芷防風松脂硃砂研木鱉子肉各五錢麻油二斤丁香木香各三錢上先用琥珀丁香桂心硃砂木香為細末其餘藥入油內煎焦黑濾去粗徐徐入黃丹再煎軟硬得中即成膏矣神效栝蔞散治乳癰初起腫痛及一切癰疽或膿出後餘毒亦宜用之黃栝蔞子多者一個當歸半兩生甘草半兩沒藥一錢另研乳香一錢上酒水煎服余方見下卷
